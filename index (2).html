<style>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0;color:var(--turf)}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:.08em}
.sync{font-size:12px;color:var(--mute)}

/* ---------- race rail ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:thin}
.rchip{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px}
.rchip[aria-current="true"]{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.rchip .rname{font-weight:700;font-size:14px;white-space:nowrap}
.rchip .rmeta{grid-column:2;font-size:12px;color:var(--mute);white-space:nowrap}
.grade{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.4}
.g-G1{color:var(--turf)} .g-G2{color:var(--ink)} .g-G3{color:var(--gold)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:1px}

/* ---------- race head ---------- */
.head{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--turf);border-radius:14px;padding:18px;display:grid;gap:14px}
.head h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px}
.trackbar{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.cond{display:flex;align-items:center;gap:10px;background:var(--turf-soft);border-radius:10px;padding:8px 14px}
.cond b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--turf)}
.cond span{font-size:12px;color:var(--mute);line-height:1.4}
.biaspill{display:flex;flex-direction:column;justify-content:center;border:1px dashed var(--line);border-radius:10px;padding:8px 14px}
.biaspill small{font-size:11px;color:var(--mute);letter-spacing:.08em}
.biaspill strong{font-size:15px}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:5px;border-radius:12px;margin-block:16px}
.tab{border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:700;font-size:15px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab small{display:block;font-weight:500;font-size:11px}

/* ---------- sections ---------- */
.panel{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.panel>*,.plan>*,.sec{min-width:0}
.plan{grid-template-columns:minmax(0,1fr)}
.sec h3{font-size:13px;letter-spacing:.12em;color:var(--mute);font-weight:700;margin:0 0 10px}
.lead{font-size:15px;margin:0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.impact li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.t-good{background:var(--good-soft);color:var(--good)} .t-bad{background:var(--red-soft);color:var(--bad)} .t-warn{background:var(--amber-soft);color:var(--amber)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;color:var(--mute);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
.tip{font-size:13px;color:var(--mute);margin:8px 2px 0}

.fc{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:5px;font-family:var(--mono);font-size:13px;font-weight:600;border:1px solid transparent;vertical-align:middle}
.fr1{background:var(--f1);color:var(--f1t);border-color:#9aa39e} .fr2{background:var(--f2);color:var(--f2t)} .fr3{background:var(--f3);color:#fff} .fr4{background:var(--f4);color:#fff}

.rank{display:inline-grid;place-items:center;width:28px;height:24px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--sunk);color:var(--mute)}
.rk-S{background:var(--turf);color:var(--surface)} .rk-A{background:var(--gold);color:#1e1406}

.del:hover{color:var(--bad);background:var(--red-soft)}

.bline:last-child{border-bottom:0}

.sire{white-space:nowrap;font-weight:700}
.prof{display:block;font-size:11.5px;color:var(--mute);font-weight:500;white-space:nowrap}
.apt{display:flex;align-items:center;gap:8px;min-width:110px}
.apt b{font-family:var(--mono);font-size:16px;width:2.2em;text-align:right}
.apt .bar{flex:1;margin:0}
.bnote{font-size:12.5px;color:var(--mute);min-width:180px}
.bnote .g{color:var(--good)} .bnote .x{color:var(--bad)}

  .mybets form{grid-template-columns:1fr 1fr}
  .mybets .wide{grid-column:1/-1}

}

<script>
(function(){
  const S={races:[],sel:null,tab:'track',plan:{},db:null,dbState:'wait',my:{tickets:[],memo:''},unsubMy:null,chain:Promise.resolve(),readonly:false};

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const yen=n=>Number(n||0).toLocaleString('ja-JP')+'円';

  const race=()=>S.races.find(r=>r.id===S.sel);

  const fmtDate=r=>{const [y,m,d]=(r.date||'').split('-');return m?`${+m}/${+d}（${esc(r.dow||'')}）`:''};

  /* ---------- rail + head ---------- */
  function renderRail(){
    const rail=$('rail');

      <span class="grade g-${esc(r.grade)}">${esc(r.grade)}</span><span class="rname">${r.status==='open'?'<span class="live" aria-label="予想公開中"></span>':''}${esc(r.name)}</span>

  }
  function renderHead(){
    const r=race(),h=$('head');
    if(!r){h.innerHTML=S.dbState==='none'?'<p class="notice">このビューではデータを読み込めません。claude.ai で開いてください。</p>':'<div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:26px"></div>';return}
    const t=r.track||{};
    h.innerHTML=`<div class="meta"><span><span class="grade g-${esc(r.grade)}">${esc(r.grade)}</span></span><span>${fmtDate(r)} ${esc(r.post||'')}発走</span><span>${esc(r.venue)} ${esc(r.course)}</span><span>${esc(r.field||'')}頭</span><span>${r.status==='open'?'予想公開中':'レース終了'}</span></div>

  /* ---------- 馬場 ---------- */
  function impactTag(s){
    const m=s.match(/^(\S+)\s*/);const e=m?m[1]:'';const text=s.replace(/^[^\s぀-ヿ一-鿿A-Za-z0-9]+\s*/,'');
    const map={'🟢':['t-good','追い風'],'🔵':['t-good','追い風'],'🔴':['t-bad','逆風'],'🟡':['t-warn','注意'],'⚠️':['t-warn','注意'],'⚡':['t-warn','注目'],'🔁':['t-good','注目'],'📊':['t-warn','データ'],'🏇':['t-warn','注目']};

  }
  function fitClass(v){return v==='◎'||v==='○'?'fit-good':(v==='×'||v==='✗'?'fit-bad':'')}
  function renderTrack(r){

      h+=`<section class="sec"><h3>同じ条件の前日レース</h3><div class="card" style="padding:0">

        <div style="overflow-x:auto"><table><thead><tr><th>着</th><th>馬名</th><th>脚質</th><th>位置</th><th class="r">上がり</th><th class="hide-sm">メモ</th></tr></thead><tbody>
        ${(p.results||[]).map(x=>`<tr><td class="num">${esc(x.rank)}</td><td style="font-weight:700;white-space:nowrap">${esc(x.name)}</td><td>${esc(x.style)}</td><td style="white-space:nowrap">${esc(x.pos)}</td><td class="r num">${esc(x.agari)}</td><td class="hide-sm" style="font-size:13px;color:var(--mute)">${esc(x.note)}</td></tr>`).join('')}

    });
    if(r.conditionChange&&r.conditionChange.length) h+=`<section class="sec"><h3>馬場で変わること</h3><div class="scroll"><table><thead><tr><th>項目</th><th>良のとき</th><th>今回の馬場</th></tr></thead><tbody>
      ${r.conditionChange.map(c=>`<tr><td style="font-weight:700;white-space:nowrap">${esc(c.item)}</td><td>${esc(c.good)}</td><td>${esc(c.heavy)}</td></tr>`).join('')}</tbody></table></div></section>`;
    if(r.matrix&&r.matrix.length) h+=`<section class="sec"><h3>各馬の馬場適性</h3><div class="scroll"><table><thead><tr><th>評価</th><th>馬</th><th class="r">人気</th><th>脚質</th><th>適性</th><th>理由</th></tr></thead><tbody>
      ${r.matrix.map(m=>`<tr><td><span class="rank rk-${esc((m.rank||'')[0])}">${esc(m.rank)}</span></td><td><span class="hname">${chip(m.num,fm)}${esc(m.name)}</span></td><td class="r num">${esc(m.pop||'—')}</td><td>${esc(m.style)}</td><td class="fit ${fitClass(m.heavy)}">${esc(m.heavy)}</td><td style="font-size:13.5px;min-width:200px">${esc(m.data)}</td></tr>`).join('')}</tbody></table></div></section>`;
    if(r.pickup&&r.pickup.length) h+=`<section class="sec"><h3>浮上する馬</h3><div class="cards2">${r.pickup.map(p=>`<article class="card pick"><div class="lbl">${esc(p.label)}</div><h4>${chip(p.num,fm)}${esc(p.name)}</h4><div class="odds num">${p.pop?esc(p.pop)+'番人気':''}${p.odds?' '+esc(p.odds)+'倍':''}</div><ul>${(p.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</div></section>`;
    if(r.danger&&r.danger.length) h+=`<section class="sec"><h3>危ない人気馬</h3><div class="cards2">${r.danger.map(p=>`<article class="card pick danger"><div class="lbl">要注意</div><h4>${chip(p.num,fm)}${esc(p.name)}</h4><div class="odds num">${p.pop?esc(p.pop)+'番人気':''}${p.odds?' '+esc(p.odds)+'倍':''}</div><p>${esc(p.note)}</p></article>`).join('')}</div></section>`;
    return h;

  /* ---------- 血統 ---------- */
  const profTxt=p=>p?`${p.surface}・${p.dist}・道悪${p.heavy}`:'DB未登録';
  function renderBlood(r){
    const b=r.blood,fm=frameMap(r);

      ${hs.map(x=>`<tr><td><span class="hname">${chip(x.num,fm)}${esc(x.name)}</span></td>

  const legsText=legs=>legs.map(g=>g.join(',')).join(' - ');

    const fm=frameMap(r);let h='';

      const total=p.tickets.reduce((a,t)=>a+t.points*t.unit,0),pts=p.tickets.reduce((a,t)=>a+t.points,0);
      h+=`<section class="sec"><h3>推奨プラン</h3><div class="plan">
        ${plans.length>1?`<div class="seg" role="group" aria-label="馬場ごとのプラン">${plans.map(x=>`<button class="segb" data-plan="${esc(x.id)}" aria-pressed="${x.id===p.id}">${esc(x.label)}</button>`).join('')}</div>`:''}
        <div class="card plan">
          <div class="axis"><small>軸</small><strong>${esc(p.axis)}</strong><span class="when">${esc(p.when)}</span></div>
          <p style="margin:0;font-size:14px">${esc(p.why)}</p>
        </div>
        <div class="scroll"><table><thead><tr><th>券種</th><th>買い目</th><th class="r">点数</th><th class="r">1点</th><th class="r">金額</th></tr></thead><tbody>
          ${p.tickets.map(t=>`<tr><td class="ttype">${esc(t.type)}${t.form?`<small>${esc(t.form)}</small>`:''}</td><td>${legsHtml(t.legs,fm)}</td><td class="r num">${t.points}</td><td class="r num">${yen(t.unit)}</td><td class="r num">${yen(t.points*t.unit)}</td></tr>`).join('')}
          <tr class="total"><td>合計</td><td></td><td class="r num">${pts}</td><td></td><td class="r num">${yen(total)}</td></tr>
        </tbody></table></div>
      </div></section>`;
    }
    const marks=r.marks||[];
    if(marks.length) h+=`<section class="sec"><h3>印と1000回シミュレーション</h3><div class="scroll"><table><thead><tr><th>印</th><th>馬</th><th class="r">人気</th><th class="r">単勝</th><th class="r">勝率</th><th>複勝率</th><th class="hide-sm">騎手</th></tr></thead><tbody>
      ${marks.map(m=>`<tr><td class="mk">${esc(m.mark)}</td><td><span class="hname">${chip(m.num,fm)}${esc(m.name)}${m.ev>=1.2?'<span class="ev">妙味</span>':''}</span></td><td class="r num">${esc(m.pop)}</td><td class="r num">${esc(m.tan)}</td><td class="r num">${esc(m.winPct)}%</td><td><span class="num">${esc(m.place3Pct)}%</span><div class="bar"><i style="width:${Math.min(100,+m.place3Pct||0)}%"></i></div></td><td class="hide-sm" style="white-space:nowrap">${esc(m.jockey)}</td></tr>`).join('')}
      </tbody></table></div><p class="tip">勝率・複勝率は、スコアに展開のぶれ（正規乱数σ=8）を加えて1000回走らせた結果です。「妙味」は勝率×単勝オッズが1.2以上の馬。</p></section>`;
    return h;
  }
  function renderMyList(){
    const box=$('mylist');if(!box)return;
    const t=S.my.tickets||[];
    const total=t.reduce((a,x)=>a+(+x.points||0)*(+x.unit||0),0);
    box.innerHTML=t.length?`<div style="overflow-x:auto"><table><thead><tr><th>券種</th><th>買い目</th><th class="r">点数</th><th class="r">金額</th><th></th></tr></thead><tbody>
      ${t.map((x,i)=>`<tr><td class="ttype">${esc(x.type)}</td><td class="num">${esc(x.text)}</td><td class="r num">${esc(x.points)}</td><td class="r num">${yen(x.points*x.unit)}</td><td class="r"><button class="del" data-del="${i}" aria-label="${esc(x.type)} ${esc(x.text)} を削除">削除</button></td></tr>`).join('')}
      <tr class="total"><td>合計</td><td></td><td class="r num">${t.reduce((a,x)=>a+(+x.points||0),0)}</td><td class="r num">${yen(total)}</td><td></td></tr></tbody></table></div>`
      :`<p class="empty">まだ買い目がありません。下のフォームから追加するか、推奨プランを写してください。</p>`;
    const memo=$('f-memo');if(memo&&document.activeElement!==memo)memo.value=S.my.memo||'';
    const off=!S.db||S.readonly;['f-add','f-copy','f-memo','f-type','f-legs','f-pts','f-unit'].forEach(id=>{const el=$(id);if(el)el.disabled=off});
    const st=$('savestate');if(st&&off)st.textContent=S.db?'このビューでは閲覧のみです。':'claude.ai で開くと保存できます。';
  }

  /* ---------- save ---------- */
  function save(next){
    const r=race();if(!S.db||!r||S.readonly)return;
    S.my=next;renderMyList();const st=$('savestate');if(st)st.textContent='保存中…';
    const body={tickets:next.tickets,memo:next.memo||'',updatedAt:new Date().toISOString()};
    const ref=S.db.doc(`races/${r.id}/mybets/main`);
    S.chain=S.chain.then(()=>ref.set(body)).then(()=>{const s=$('savestate');if(s)s.textContent='保存しました';})
      .catch(e=>{const s=$('savestate');if(e&&e.code==='invalid_argument'){S.readonly=true;renderMyList();if(s)s.textContent='このビューでは保存できません。'}else if(s)s.textContent='保存できませんでした。もう一度お試しください。'});
  }

  /* ---------- render ---------- */
  function render(){
    renderRail();renderHead();
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
    const r=race(),panel=$('panel');
    if(!r){panel.innerHTML=S.dbState==='none'?'':'<div class="card"><div class="skel" style="width:80%"></div></div>';return}
    panel.innerHTML=S.tab==='track'?renderTrack(r):S.tab==='blood'?renderBlood(r):renderBet(r);
    if(S.tab==='bet')renderMyList();
  }
  function select(id){
    if(id===S.sel)return;S.sel=id;S.my={tickets:[],memo:''};
    try{history.replaceState(null,'','#'+id)}catch(e){}
    render();
  }
  function subscribeMy(){
    if(S.unsubMy){S.unsubMy();S.unsubMy=null}
    if(!S.db||!S.sel)return;
    S.unsubMy=S.db.doc(`races/${S.sel}/mybets/main`).onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;S.my={tickets:(d&&d.tickets||[]).map(x=>({...x})),memo:(d&&d.memo)||''};renderMyList();
    },()=>{});
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const rc=e.target.closest('[data-race]');if(rc){select(rc.dataset.race);return}
    const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;store.set('kk-tab',S.tab);render();return}
    const pb=e.target.closest('[data-plan]');if(pb){const r=race();S.plan[r.id]=pb.dataset.plan;render();return}
    const del=e.target.closest('[data-del]');if(del){const i=+del.dataset.del;const t=S.my.tickets.filter((_,k)=>k!==i);save({...S.my,tickets:t});return}
    if(e.target.id==='f-copy'){
      const r=race();const plans=r.plans||[];const p=plans.find(x=>x.id===(S.plan[r.id]||(plans[0]&&plans[0].id)))||plans[0];if(!p)return;
      const add=p.tickets.map(t=>({type:t.type,text:legsText(t.legs),points:t.points,unit:t.unit}));
      save({...S.my,tickets:[...S.my.tickets,...add]});
    }
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='myform')return;e.preventDefault();
    const text=$('f-legs').value.trim();const pts=Math.max(1,parseInt($('f-pts').value)||1);const unit=Math.max(100,parseInt($('f-unit').value)||100);
    if(!text){$('savestate').textContent='買い目を入力してください（例 3-13-15）';$('f-legs').focus();return}
    save({...S.my,tickets:[...S.my.tickets,{type:$('f-type').value,text,points:pts,unit}]});
    $('f-legs').value='';$('f-legs').focus();
  });
  document.addEventListener('change',e=>{if(e.target.id==='f-memo'){const v=e.target.value;if(v!==(S.my.memo||''))save({...S.my,memo:v})}});
  document.addEventListener('keydown',e=>{
    if(e.target.classList&&e.target.classList.contains('tab')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const i=TABS.indexOf(S.tab);S.tab=TABS[(i+(e.key==='ArrowRight'?1:2))%3];store.set('kk-tab',S.tab);render();$('tab-'+S.tab).focus()}
  });

  /* ---------- data ---------- */
  render();
  try{
    S.races=JSON.parse(document.getElementById('kk-data').textContent).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||String(b.date).localeCompare(String(a.date)));
    S.dbState='ok';$('sync').textContent='見る専用';
    const want=(location.hash||'').slice(1);const pick=S.races.find(r=>r.id===want)||S.races[0];if(pick){S.sel=pick.id}
  }catch(e){S.dbState='none'}
  render();
})();
</script>

</body>
</html>
